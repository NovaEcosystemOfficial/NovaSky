<!doctype html>
<html lang="it" data-runtime="desktop-shell">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05070a" />
    <title>NovaSky</title>
    <link rel="stylesheet" href="./styles/fonts.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/shell.css" />
  </head>
  <body>
    <div class="nova-app" data-nova-app>
      <aside class="nova-sidebar" data-sidebar aria-label="Navigazione">
        <div class="nova-sidebar-brand">
          <span class="nova-mark" aria-hidden="true"></span>
          <span class="nova-word">NovaSky</span>
        </div>
        <nav class="nova-nav" data-nav>
          <button type="button" class="nova-nav-item is-active" data-route="dashboard">
            <svg class="nova-nav-icon" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="2" width="7" height="5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="2" y="11" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="9" width="7" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
            <span>Dashboard</span>
          </button>
          <button type="button" class="nova-nav-item" data-route="mission-map">
            <svg class="nova-nav-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="7" cy="8" r="1" fill="currentColor"/><circle cx="13" cy="7" r="0.7" fill="currentColor"/><circle cx="11" cy="13" r="1.2" fill="currentColor"/></svg>
            <span>Mission Map</span>
          </button>
          <button type="button" class="nova-nav-item" data-route="missione">
            <svg class="nova-nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h8M4 15h10" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            <span>Missione</span>
          </button>
          <button type="button" class="nova-nav-item" data-route="catalogo">
            <svg class="nova-nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14v3H3zM3 9h14v3H3zM3 14h14v3H3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span>Catalogo</span>
          </button>
          <button type="button" class="nova-nav-item" data-route="attrezzatura">
            <svg class="nova-nav-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.5 4.5l1.4 1.4M14.1 14.1l1.4 1.4M4.5 15.5l1.4-1.4M14.1 5.9l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span>Attrezzatura</span>
          </button>
          <button type="button" class="nova-nav-item" data-route="diario">
            <svg class="nova-nav-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h10a1 1 0 011 1v13l-3-2-3 2-3-2-3 2V4a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span>Diario</span>
          </button>
          <button type="button" class="nova-nav-item" data-route="impostazioni">
            <svg class="nova-nav-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10 2v2M10 16v2M2 10h2M16 10h2M10 5.5a4.5 4.5 0 010 9" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
            <span>Impostazioni</span>
          </button>
        </nav>
        <div class="nova-sidebar-status" data-observatory-status>
          <span class="nova-status-dot" aria-hidden="true"></span>
          <div class="nova-status-copy">
            <strong>Osservatorio</strong>
            <span data-status-label>Pronto</span>
          </div>
        </div>
      </aside>

      <div class="nova-main">
        <header class="nova-header" data-shell-header>
          <div class="nova-header-title">
            <h1 data-view-title>Dashboard</h1>
            <p data-view-subtitle>Centro di controllo della notte</p>
          </div>
          <div class="nova-header-meta">
            <time data-header-clock>—</time>
            <span data-header-date>—</span>
          </div>
        </header>

        <div class="nova-body">
          <main class="nova-workspace" data-workspace aria-live="polite"></main>

          <aside class="nova-panel" data-context-panel aria-label="Pannello contestuale">
            <div class="nova-panel-head">
              <h2 data-panel-title>Contesto</h2>
              <button type="button" class="nova-panel-toggle" data-panel-toggle aria-expanded="true" title="Chiudi pannello">
                <span aria-hidden="true">›</span>
              </button>
            </div>
            <div class="nova-panel-body" data-panel-body>
              <p class="nova-panel-empty">Seleziona una vista per i dettagli operativi.</p>
            </div>
          </aside>
        </div>
      </div>
    </div>

    <script type="module" src="./shell/shell.js"></script>
  </body>
</html>
